version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /apps/api
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directories:
      - /apps/web
      - /packages/api-types
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      node:
        patterns: ["*"]
    ignore:
      # typescript-eslint does not support TypeScript 7 yet, and eslint-config-next's plugins
      # do not support eslint 10. @types/node follows the Node runtime (24.x, see engines).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
