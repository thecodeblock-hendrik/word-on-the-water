name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, types, tests)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://app_runtime:runtime_local@localhost:5432/wotw
      DATABASE_URL_DIRECT: postgresql+asyncpg://app_migrator:migrator_local@localhost:5432/wotw
      REDIS_URL: redis://localhost:6379/0
      SERVICE_TOKEN: ci-service-token-not-a-secret
      CRON_SECRET: ci-cron-secret-not-a-secret
      IP_HASH_SALT: ci-salt-not-a-secret
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: wotw
          POSTGRES_PASSWORD: wotw_local
          POSTGRES_DB: wotw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wotw -d wotw"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: valkey/valkey:9
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests
      - name: Create database roles and extensions
        working-directory: .
        run: psql "postgresql://wotw:wotw_local@localhost:5432/wotw" -f docker/postgres/init.sql
      - run: uv run alembic upgrade head
      - name: Install pg_dump 17 and age (backup tests)
        working-directory: .
        run: scripts/install_backup_tools.sh
      - name: Tests with coverage gate on services
        run: uv run pytest --cov=app/services --cov-report=term-missing --cov-fail-under=85

  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web lint
      - run: pnpm --dir apps/web format:check
      - run: pnpm --dir apps/web typecheck
      - run: pnpm --dir apps/web test
      - run: pnpm --dir apps/web build
        env:
          API_BASE_URL: http://localhost:8000
          SERVICE_TOKEN: build-check-service-token-0123456789
          API_BYPASS_SECRET: build-check-bypass-0123456789
          CRON_SECRET: build-check-cron-0123456789
          SENTRY_DSN: https://abc123@o1.ingest.de.sentry.io/42
      - name: No secrets in the client bundle
        run: uv run scripts/check_bundle_secrets.py apps/web/.next/static apps/web/public
        env:
          API_BASE_URL: http://localhost:8000
          SERVICE_TOKEN: build-check-service-token-0123456789
          API_BYPASS_SECRET: build-check-bypass-0123456789
          CRON_SECRET: build-check-cron-0123456789
          SENTRY_DSN: https://abc123@o1.ingest.de.sentry.io/42

  types:
    name: Generated API types are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: (cd apps/api && uv sync --locked)
      - run: make types-check

  e2e:
    name: End to end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec playwright install --with-deps
      - run: pnpm --dir apps/web e2e
        env:
          CI: "true"
          # No API runs in this job: an unreachable URL exercises the health route's "unavailable" path.
          API_BASE_URL: http://127.0.0.1:9
          SERVICE_TOKEN: e2e-placeholder-not-a-secret
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7
