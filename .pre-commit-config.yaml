repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.2.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        files: ^apps/api/
        args: [--fix]
      - id: ruff-format
        files: ^apps/api/
  - repo: local
    hooks:
      - id: web-prettier
        name: prettier
        entry: bash -c 'cd apps/web && pnpm exec prettier --check --ignore-unknown "${@#apps/web/}"' --
        language: system
        files: ^apps/web/
      - id: web-eslint
        name: eslint
        entry: bash -c 'cd apps/web && pnpm exec eslint "${@#apps/web/}"' --
        language: system
        files: ^apps/web/.*\.(ts|tsx|js|mjs)$
