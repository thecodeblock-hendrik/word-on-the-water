# Accepted vulnerabilities. Every entry needs a reason and an expiry; review when it lapses.

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2026-12-31
reason = "minimatch DoS via globparts amplification (medium). Only patched in 11.0.1; the 3.x, 5.x and 10.x lines our dev tooling uses have no fix. Dev-only (no production dependency), and it only expands our own build globs, never user input."

[[IgnoredVulns]]
id = "GHSA-3g3m-2fjr-6pw4"
ignoreUntil = 2026-12-01
reason = "glob AbortSignal bypass (medium), fixed in 14.0.2. Reached only through @sentry/node -> @sentry/bundler-plugins, which pins glob ^13 and is a build-time source map tool we do not run. We never pass an AbortSignal to glob. Re-check when Sentry ships a glob 14 release."
